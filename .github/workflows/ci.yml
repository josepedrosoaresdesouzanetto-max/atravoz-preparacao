name: Checks (no deployment)
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: python -m pytest -q
      - run: python -m ruff check services tests scripts
      - run: npm test
      - run: npm run lint
      - run: npm run build
